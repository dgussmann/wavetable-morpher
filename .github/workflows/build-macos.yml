name: Build macOS (Apple Silicon)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15   # Apple Silicon runner
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DWTM_BUILD_TESTS=ON

      - name: Build plugin (VST3, AU, Standalone) and self-test
        run: cmake --build build --config Release -j 4

      - name: Run self-test
        run: ./build/WavetableMorpherTests_artefacts/Release/WavetableMorpherTests "$RUNNER_TEMP"

      - name: Sign (ad-hoc) and package
        run: |
          ART="build/WavetableMorpher_artefacts/Release"
          DIST="dist/Wavetable Morpher"
          mkdir -p "$DIST"
          cp -R "$ART/VST3/Wavetable Morpher.vst3" "$DIST/"
          cp -R "$ART/AU/Wavetable Morpher.component" "$DIST/"
          cp -R "$ART/Standalone/Wavetable Morpher.app" "$DIST/"
          for b in "$DIST"/*.vst3 "$DIST"/*.component "$DIST"/*.app; do
            codesign --force --deep --sign - "$b"
          done
          cp packaging/Install.command "$DIST/"
          cp packaging/HOW-TO-INSTALL.txt "$DIST/"
          chmod +x "$DIST/Install.command"
          file "$DIST/Wavetable Morpher.vst3/Contents/MacOS/Wavetable Morpher"
          (cd dist && ditto -c -k --keepParent "Wavetable Morpher" "Wavetable-Morpher-macOS-arm64.zip")

      - name: Validate Audio Unit
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "dist/Wavetable Morpher/Wavetable Morpher.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -v aumu Wtmr Dgsm

      - uses: actions/upload-artifact@v4
        with:
          name: Wavetable-Morpher-macOS-arm64
          path: dist/Wavetable-Morpher-macOS-arm64.zip
          retention-days: 90

      - name: Publish as the "latest" release (one-click download)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/Wavetable-Morpher-macOS-arm64.zip \
            --title "Wavetable Morpher (latest build)" \
            --notes "Apple Silicon build of commit ${GITHUB_SHA::7}. Download the zip, unzip it, then see HOW-TO-INSTALL.txt inside." \
            --target "$GITHUB_SHA"
